<!DOCTYPE html>
<html>
<head>
    <title>Multi-Format Text Cleaner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            font-size: 15px;
        }

        input[type="text"] {
            padding: 8px;
            margin: 5px;
        }

        .options {
            margin-top: 15px;
            line-height: 30px;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

<h1>Multi-Format Text Cleaner</h1>

<form method="POST">

<textarea name="text" placeholder="Enter your text here..."></textarea>

<br><br>

<label>Pattern to Replace:</label>
<input type="text" name="pattern">

<label>Replace With:</label>
<input type="text" name="replacement">

<div class="options">

<label>
<input type="checkbox" name="whitespace">
Remove Extra Whitespace
</label>

<br>

<label>
<input type="checkbox" name="formatting">
Apply Basic Formatting
</label>

<br>

<label>
<input type="checkbox" name="encoding">
Normalize Text Encoding
</label>

</div>

<button type="submit">Clean Text</button>

</form>


{% if cleaned_text %}

<div class="result">

<h2>Cleaned Text:</h2>

<textarea readonly>{{ cleaned_text }}</textarea>

</div>

{% endif %}

</div>

</body>
</html>
